{# 使い方ガイド用の最小限インラインSVGアイコン(外部画像・CDN不使用)。 #}

{% macro icon(name, size=20) -%}
{%- set s = size -%}
<svg width="{{ s }}" height="{{ s }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'idea' -%}
<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3 11.2V16h6v-1.8A6 6 0 0 0 12 3Z"/>
{%- elif name == 'script' -%}
<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6M9 8h2"/>
{%- elif name == 'film' -%}
<rect x="3" y="6" width="13" height="12" rx="1"/><path d="M16 9l5-3v12l-5-3"/>
{%- elif name == 'shield' -%}
<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/>
{%- elif name == 'upload' -%}
<path d="M7 18a4 4 0 0 1-1-7.9A5 5 0 0 1 16 8a4.5 4.5 0 0 1 1 8.9"/><path d="M12 12v7M9 15l3-3 3 3"/>
{%- elif name == 'chart' -%}
<path d="M4 20V10M10 20V4M16 20v-6"/><path d="M2 20h20"/>
{%- elif name == 'target' -%}
<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.6" fill="currentColor"/>
{%- elif name == 'layers' -%}
<path d="M12 3l9 5-9 5-9-5 9-5Z"/><path d="M3 13l9 5 9-5"/>
{%- elif name == 'question' -%}
<circle cx="12" cy="12" r="9"/><path d="M9.3 9.3a2.7 2.7 0 1 1 3.9 2.4c-.9.5-1.2 1-1.2 2.1"/><path d="M12 17h.01"/>
{%- elif name == 'check' -%}
<circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.3 2.3 4.7-5.1"/>
{%- endif -%}
</svg>
{%- endmacro %}
