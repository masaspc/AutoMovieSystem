[project]
name = "auto-movie-system"
version = "0.1.0"
description = "YouTube自動投稿・レビュー・成長改善システム"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "jinja2>=3.1",
  "python-multipart>=0.0.20",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "celery[redis]>=5.4",
  "redis>=5.2",
  "httpx>=0.28",
  "tenacity>=9.0",
  "structlog>=24.4",
  "cryptography>=43.0",
  "itsdangerous>=2.2",
  "pillow>=11.0",
  "google-api-python-client>=2.150",
  "google-auth>=2.35",
  "google-auth-oauthlib>=1.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "mypy>=1.14",
  "pre-commit>=4.0",
  "types-redis>=4.6",
  "types-psycopg2>=2.9",
  "pip-audit>=2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "S",   # flake8-bandit
]
ignore = [
  "S101", # assert usage (needed in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"migrations/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
packages = ["app"]
mypy_path = "."
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
no_implicit_optional = true
strict_equality = true
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = "migrations.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "integration: requires PostgreSQL/Redis services",
  "e2e: end-to-end dry-run workflow tests",
  "contract: provider Protocol contract tests",
  "media: requires real ffmpeg/ffprobe binaries",
]
testpaths = ["tests"]
