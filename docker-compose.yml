services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auto_movie_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  voicevox:
    image: voicevox/voicevox_engine:cpu-ubuntu22.04-0.25.1
    profiles: ["voicevox"]
    ports:
      # ホスト側50021が別プロセス(VS Code等)に使われている環境があるため50022で公開。
      # app/worker/beatはDocker内部ネットワークのvoicevox:50021へ直接接続するため、
      # このホスト公開ポートはホストからの動作確認用にすぎず変更しても機能に影響しない。
      - "127.0.0.1:50022:50021"
    healthcheck:
      # イメージにpython/python3が含まれておらずurllib版healthcheckは常に失敗するため、
      # イメージに存在するcurlを使う。
      test: ["CMD", "curl", "-f", "http://127.0.0.1:50021/version"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  app:
    build: .
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/auto_movie_system
      REDIS_URL: redis://redis:6379/0
      VOICEVOX_BASE_URL: http://voicevox:50021
    ports:
      - "8000:8000"
    volumes:
      - ./generated:/app/generated
      - ./assets:/app/assets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      voicevox:
        condition: service_healthy
        required: false
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: .
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/auto_movie_system
      REDIS_URL: redis://redis:6379/0
      VOICEVOX_BASE_URL: http://voicevox:50021
    volumes:
      - ./generated:/app/generated
      - ./assets:/app/assets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      voicevox:
        condition: service_healthy
        required: false
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]

  beat:
    build: .
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/auto_movie_system
      REDIS_URL: redis://redis:6379/0
      VOICEVOX_BASE_URL: http://voicevox:50021
    volumes:
      - ./generated:/app/generated
      - ./assets:/app/assets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      voicevox:
        condition: service_healthy
        required: false
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info"]

volumes:
  postgres_data:
